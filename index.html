<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Course Advisor</title>
        <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background-color: #fffffff1;
        display: flex;
        justify-content: center;
        padding: 60px 20px;
    }

    .container {
        background: white;
        padding: 40px;
        border-radius: 0;
        width: 100%;
        max-width: 600px;
    }

    h1 {
        font-size: 14px;
        margin-bottom: 8px;
        color: #111;
        text-align: center;
    }

    p {
        color: #000000;
        margin-bottom: 24px;
        font-size: 14px;
        text-align: center;
    }

    textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 0;
        font-size: 14px;
        resize: none;
        height: 100px;
        margin-bottom: 12px;
    }

    button {
        background-color: #ffffff;
        color: black;
        border: 1px solid black;
        padding: 12px 24px;
        border-radius: 0;
        font-size: 14px;
        cursor: pointer;
        width: 100%;
    }

    .answer {
        margin-top: 24px;
        padding: 16px;
        background: #ffffff;
        border-radius: 0;
        font-size: 14px;
        color: #333;
        display: none;
    }
</style>
</head>
<body>
<div class="container">
    <h1>Course Advisor</h1>
    <p>Ask a question about any class or teacher at your school.</p>

    <textarea id="question"></textarea>

    <button onclick="askQuestion()">Ask</button>

    <div class="answer" id="answer"></div>
</div>
<script>
    async function askQuestion() {
        const question = document.getElementById("question").value;

        if (!question) return;

        const answerDiv = document.getElementById("answer");
        answerDiv.style.display = "block";

        const response = await fetch("https://course-planning-project.onrender.com/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ question: question })
        });

        const data = await response.json();
        answerDiv.textContent = data.answer;
    }
</script>
</body>
</html>
